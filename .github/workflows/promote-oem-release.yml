name: Promote OEM Release

on:
  workflow_dispatch:
    inputs:
      brand:
        description: '品牌：bugu / seenx'
        required: true
        default: 'seenx'
        type: choice
        options:
          - seenx
          - bugu
      tag:
        description: '要提升为 latest 的 tag，例如 v0.10.1'
        required: true
      channel:
        description: '发布通道'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      dry_run:
        description: '只校验 GitHub Release 产物，不更新 latest'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.brand }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ inputs.brand }} ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify OEM release assets
        run: |
          node scripts/promote-oem-release.mjs \
            --brand=${{ inputs.brand }} \
            --tag=${{ inputs.tag }} \
            --channel=${{ inputs.channel }} \
            --dry-run=true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  promote:
    name: Promote ${{ inputs.brand }} ${{ inputs.tag }} to ${{ inputs.channel }}
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ inputs.dry_run == 'false' }}
    environment: oem-promotion
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      RELEASE_PROMOTE_API_URL: ${{ vars.RELEASE_PROMOTE_API_URL || secrets.RELEASE_PROMOTE_API_URL }}
      RELEASE_PROMOTE_API_TOKEN: ${{ secrets.RELEASE_PROMOTE_API_TOKEN }}
    steps:
      - name: Download promote script
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/promote-oem-release.mjs?ref=${GITHUB_SHA}" \
            -o /tmp/promote-oem-release.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Promote OEM release
        run: |
          node /tmp/promote-oem-release.mjs \
            --brand=${{ inputs.brand }} \
            --tag=${{ inputs.tag }} \
            --channel=${{ inputs.channel }} \
            --dry-run=false
