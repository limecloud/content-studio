name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Local Contract
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      CONTENT_STUDIO_REQUIRE_EXPLICIT_TEXT_KEY: '1'
      LIME_APP_SERVER_REF: ${{ vars.LIME_APP_SERVER_REF || 'v1.66.0' }}
      LIME_DESKTOP_PLATFORM_REF: ${{ vars.LIME_DESKTOP_PLATFORM_REF || 'v0.2.1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust for App Server sidecar
        uses: dtolnay/rust-toolchain@stable

      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb pkg-config libasound2-dev libxdo-dev
          npx playwright install-deps chromium

      - name: Run App Server resource tests
        run: npm run app-server:prepare:test && npm run app-server:backend:test

      - name: Checkout Lime App Server source
        uses: actions/checkout@v4
        with:
          repository: limecloud/lime
          ref: ${{ env.LIME_APP_SERVER_REF }}
          path: .tmp/lime-app-server-source

      - name: Build Lime App Server sidecar
        id: app_server_sidecar
        shell: bash
        run: |
          set -euxo pipefail
          source_dir=".tmp/lime-app-server-source"
          if [ -f "${source_dir}/lime-rs/Cargo.toml" ]; then
            workspace="${source_dir}/lime-rs"
          elif [ -f "${source_dir}/src-tauri/Cargo.toml" ]; then
            workspace="${source_dir}/src-tauri"
          else
            find "${source_dir}" -maxdepth 3 -name Cargo.toml -print
            echo "Lime App Server Cargo workspace not found" >&2
            exit 1
          fi
          cargo build \
            --manifest-path "${workspace}/Cargo.toml" \
            -p app-server \
            --release
          sidecar="${workspace}/target/release/app-server"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            sidecar="${sidecar}.exe"
          fi
          if [ ! -f "${sidecar}" ]; then
            ls -la "${workspace}/target/release"
            echo "Built App Server sidecar not found: ${sidecar}" >&2
            exit 1
          fi
          echo "binary=${sidecar}" >> "${GITHUB_OUTPUT}"

      - name: Prepare App Server sidecar resources
        shell: bash
        run: |
          set -euxo pipefail
          npm run app-server:prepare:release -- \
            --binary "${{ steps.app_server_sidecar.outputs.binary }}" \
            --version "${LIME_APP_SERVER_REF#v}"

      - name: Checkout Lime Desktop Platform source
        uses: actions/checkout@v4
        with:
          repository: limecloud/lime-desktop-platform
          ref: ${{ env.LIME_DESKTOP_PLATFORM_REF }}
          path: .tmp/lime-desktop-platform

      - name: Build Lime Desktop Platform packages
        run: |
          npm ci --prefix .tmp/lime-desktop-platform
          npm run build:packages --prefix .tmp/lime-desktop-platform

      - name: Run local verification
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run verify:local

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          path: |
            .playwright-mcp/e2e-results
            .playwright-mcp/e2e-report
