name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Local Contract
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      CONTENT_STUDIO_REQUIRE_EXPLICIT_TEXT_KEY: '1'
      LIME_APP_SERVER_REF: ${{ vars.LIME_APP_SERVER_REF || 'v1.59.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust for App Server sidecar
        uses: dtolnay/rust-toolchain@stable

      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium

      - name: Run App Server resource tests
        run: npm run app-server:prepare:test && npm run app-server:backend:test

      - name: Checkout Lime App Server source
        uses: actions/checkout@v4
        with:
          repository: limecloud/lime
          ref: ${{ env.LIME_APP_SERVER_REF }}
          path: .tmp/lime-app-server-source

      - name: Build Lime App Server sidecar
        shell: bash
        run: |
          set -euxo pipefail
          cargo build \
            --manifest-path ".tmp/lime-app-server-source/lime-rs/Cargo.toml" \
            -p app-server \
            --release

      - name: Prepare App Server sidecar resources
        shell: bash
        run: |
          set -euxo pipefail
          npm run app-server:prepare:release -- \
            --binary ".tmp/lime-app-server-source/lime-rs/target/release/app-server" \
            --version "${LIME_APP_SERVER_REF#v}"

      - name: Run local verification
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run verify:local

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          path: |
            .playwright-mcp/e2e-results
            .playwright-mcp/e2e-report
