name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Local Contract
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      CONTENT_STUDIO_REQUIRE_EXPLICIT_TEXT_KEY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium

      - name: Run local verification
        run: xvfb-run -a npm run verify:local

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          path: |
            .playwright-mcp/e2e-results
            .playwright-mcp/e2e-report
