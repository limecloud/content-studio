name: Release Desktop Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要打包发布的 tag，例如 v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npm run build && npx electron-builder --config electron-builder.yml --mac dmg zip --publish never
          - name: Windows
            os: windows-latest
            command: npm run build && npx electron-builder --config electron-builder.yml --win nsis --publish never
          - name: Linux
            os: ubuntu-latest
            command: npm run build && npx electron-builder --config electron-builder.yml --linux AppImage --publish never

    env:
      # CI 默认不做 Developer ID / notarization；生产签名后续用 CSC_* 和 APPLE_* secrets 接入。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux package helpers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Package desktop app
        run: ${{ matrix.command }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: content-studio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -type f -maxdepth 2 -print | sort

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-artifacts/**/*
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
