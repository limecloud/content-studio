name: Release Desktop Packages

on:
  push:
    tags:
      - 'v*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要打包发布的 tag，例如 v0.10.0'
        required: true
        default: 'v0.10.0'
      source_ref:
        description: '构建使用的源码 ref；为空时使用 tag'
        required: false
        default: ''
      brand:
        description: '品牌：bugu / seenx / all'
        required: true
        default: 'seenx'
      platform:
        description: '平台：mac / win / linux / all'
        required: true
        default: 'mac'
      publish:
        description: '是否发布到 GitHub Release：true / false'
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.brand || 'all' }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve OEM Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      publish: ${{ steps.resolve.outputs.publish }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.tag) || github.ref }}

      - name: Resolve matrix
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BRAND: ${{ inputs.brand }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          node -e '
          const path = require("path");
          const fs = require("fs");
          const eventName = process.env.EVENT_NAME;
          const brandDir = path.join(process.cwd(), "oem", "brands");
          const allBrands = fs.readdirSync(brandDir)
            .filter((name) => name.endsWith(".json"))
            .map((name) => {
              const manifest = JSON.parse(fs.readFileSync(path.join(brandDir, name), "utf8"));
              return String(manifest.brandId || name.replace(/\.json$/, "")).trim();
            })
            .filter(Boolean)
            .sort();
          if (!allBrands.includes("bugu")) throw new Error("oem/brands 必须包含自动发布品牌 bugu");
          const allPlatforms = [
            { platform: "mac", osName: "macOS", os: "macos-latest", target: "--mac dmg zip" },
            { platform: "win", osName: "Windows", os: "windows-latest", target: "--win nsis" },
            { platform: "linux", osName: "Linux", os: "ubuntu-latest", target: "--linux AppImage" },
          ];
          const brandInput = eventName === "workflow_dispatch" ? (process.env.INPUT_BRAND || "seenx") : "all";
          const platformInput = eventName === "workflow_dispatch" ? (process.env.INPUT_PLATFORM || "mac") : "all";
          const publish = eventName === "workflow_dispatch" ? String(process.env.INPUT_PUBLISH || "false").toLowerCase() === "true" : true;
          const brands = brandInput === "all" ? allBrands : [brandInput];
          const platforms = platformInput === "all" ? allPlatforms : allPlatforms.filter((item) => item.platform === platformInput);
          const unknownBrands = brands.filter((brand) => !allBrands.includes(brand));
          if (unknownBrands.length) throw new Error(`未知品牌：${unknownBrands.join(", ")}`);
          if (!platforms.length) throw new Error(`未知平台：${platformInput}`);
          const include = [];
          for (const brand of brands) {
            for (const platform of platforms) include.push({ brand, ...platform });
          }
          const releaseTag = eventName === "workflow_dispatch" ? process.env.INPUT_TAG : process.env.REF_NAME;
          const sourceRef = eventName === "workflow_dispatch" ? (process.env.INPUT_SOURCE_REF || releaseTag) : process.env.REF_NAME;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=${releaseTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_ref=${sourceRef}\n`);
          '

  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    needs: resolve
    env:
      CI: 'true'
      CONTENT_STUDIO_REQUIRE_EXPLICIT_TEXT_KEY: '1'
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium

      - name: Run release verification
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run verify:local

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-diagnostics
          if-no-files-found: ignore
          path: |
            .playwright-mcp/e2e-results
            .playwright-mcp/e2e-report

  build:
    name: Build ${{ matrix.brand }} ${{ matrix.osName }}
    runs-on: ${{ matrix.os }}
    needs:
      - resolve
      - verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OEM_BRAND: ${{ matrix.brand }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux package helpers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Package renderer and main process
        run: npm run build

      - name: Prepare OEM build
        run: node scripts/prepare-oem-build.mjs --brand=${{ matrix.brand }}

      - name: Package desktop app
        run: npx electron-builder --config .tmp/oem/${{ matrix.brand }}/electron-builder.json ${{ matrix.target }} --publish never

      - name: Assert OEM artifact scope
        run: node scripts/assert-oem-artifact-scope.mjs --brand=${{ matrix.brand }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}__${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/${{ matrix.brand }}/*.dmg
            release/${{ matrix.brand }}/*.zip
            release/${{ matrix.brand }}/*.exe
            release/${{ matrix.brand }}/*.AppImage
            release/${{ matrix.brand }}/*.blockmap
            release/${{ matrix.brand }}/latest*.yml
            release/${{ matrix.brand }}/latest*.yaml

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*__*'
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: find release-artifacts -maxdepth 2 -type f -print | sort

      - name: Collect release files
        id: release-files
        run: |
          {
            find release-artifacts -type f \( \
              -name '*.dmg' -o \
              -name '*.zip' -o \
              -name '*.exe' -o \
              -name '*.AppImage' -o \
              -name '*.blockmap' -o \
              -name 'latest*.yml' -o \
              -name 'latest*.yaml' \
            \) -print | sort
          } > release-files.txt
          if [ ! -s release-files.txt ]; then
            echo "::error::No release files found."
            exit 1
          fi
          {
            echo 'files<<EOF'
            cat release-files.txt
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.release-files.outputs.files }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
